/**:
  ros__parameters:
    # publishes sensor timeouts and bad configuration on /diagnostics
    print_diagnostics: true

    # The rate sub_control runs at, so every control cycle sees a fresh estimate.
    frequency: 50.0
    # Waterlinked a50 DVL can output measurements at 4 Hz - 15 Hz
    sensor_timeout: 0.50

    # Allows processing delayed measurements by "rewinding" time rather than treating
    # them as current measurements.
    # Useful for the DVL which stamps velocity with when it was valid, which might
    # be 0.1-0.2 s before robot_localization receives it.
    smooth_lagged_data: true
    # Time filter will retain historical states and sensor measurements.
    # Needed so smooth_lagged_data can process delayed measurements optimally.
    history_length: 1.0 # s

    map_frame: map

    # Use relative measurements for yaw
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_queue_size: 10

    # Use absolute measurements for roll and pitch
    imu1: imu/data
    imu1_config: [false, false, false,
                  true, true, false,
                  false, false, false,
                  true, true, false,
                  false, false, false]
    imu1_queue_size: 10

    odom0: odometry/dvl
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   false, false, false,
                   false, false, false]
    # 5.0 is Mahalanobis distance.
    # If the measurement is more than 5 standard deviations away from the predicted value, it will be rejected as an outlier.
    odom0_twist_rejection_threshold: 5.0

    odom1: odometry/depth
    odom1_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    # Outliers rejected in a similar manner to the DVL.
    odom1_pose_rejection_threshold: 5.0

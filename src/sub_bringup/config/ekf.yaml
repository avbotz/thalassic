/**:
    ros__parameters:
        debug: false

        frequency: 20.0
        # Waterlinked a50 DVL can output measurements at 4 Hz - 15 Hz
        sensor_timeout: 0.65

        map_frame: map
        odom_frame: marlin_v2/odom
        base_link_frame: marlin_v2/base_link
        world_frame: marlin_v2/odom

        # Use relative measurements for yaw
        # AUV should always start at yaw = 0 when unkilled
        imu0: imu/data
        imu0_config: [
                      false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_relative: true

        # Use absolute measurements for roll and pitch
        imu1: imu/data
        imu1_config: [
                      false, false, false,
                      true, true, false,
                      false, false, false,
                      true, true, false,
                      false, false, false]

        # Body velocities plus absolute z; the driver derives z from the DVL
        # altitude and its pool_height parameter (z = altitude - pool_height).
        # x/y are integrated from the velocities, never fused from the DVL's
        # dead reckoning.
        odom0: odometry/dvl
        odom0_config: [false, false, true,
                      false, false, false,
                      true, true, true,
                      false, false, false,
                      false, false, false]

        # Pressure depth is superseded by the DVL altitude z above; re-enable
        # to fuse the pressure sensor again.
        # odom1: odometry/depth
        # odom1_config: [false, false, true,
        #               false, false, false,
        #               false, false, false,
        #               false, false, false,
        #               false, false, false]

        # Depth camera not on marlin
        # odom2: odom/depth_camera
        # odom2_config: [false, false, false,
        #               true, true, true,
        #               true, true, true,
        #               false, false, false,
        #               false, false, false]

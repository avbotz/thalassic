/**:
    ros__parameters:
        debug: false

        frequency: 20.0
        # Waterlinked a50 DVL can output measurements at 4 Hz - 15 Hz
        sensor_timeout: 0.65

        # map_frame is global; odom_frame, base_link_frame and world_frame are
        # namespaced per vehicle and are set from robot_name by the launch file.
        map_frame: map

        # Use relative measurements for yaw
        # AUV should always start at yaw = 0 when unkilled
        imu0: imu/data
        imu0_config: [
                      false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_relative: true

        # Use absolute measurements for roll and pitch
        imu1: imu/data
        imu1_config: [
                      false, false, false,
                      true, true, false,
                      false, false, false,
                      true, true, false,
                      false, false, false]

        odom0: odometry/dvl
        odom0_config: [false, false, false,
                      false, false, false,
                      true, true, true,
                      false, false, false,
                      false, false, false]

        odom1: odometry/depth
        odom1_config: [false, false, true,
                      false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, false]

        # Depth camera not on marlin
        # odom2: odom/depth_camera
        # odom2_config: [false, false, false,
        #               true, true, true,
        #               true, true, true,
        #               false, false, false,
        #               false, false, false]

# Luxonis Oak D Pro, will be used as front camera this season.
# Brings up an RGB + aligned stereo-depth pipeline (no on-device NN).
/**:
  ros__parameters:
    camera:
      i_pipeline_type: RGBD
      i_nn_type: none
    pipeline_gen:
      i_nn_type: none
      i_enable_rgbd: true
      i_pipeline_type: rgbd
    stereo:
      i_depth_preset: DEFAULT
      i_align_depth: true
    rgb:
      i_fps: 20.0

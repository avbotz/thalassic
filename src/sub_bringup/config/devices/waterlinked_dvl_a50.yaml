/**:
  ros__parameters:
    # Descriptions for all DVL configurations can be found on the Water Linked
    # Documentation: https://docs.waterlinked.com/dvl/dvl-protocol/

    # The DVL's static address and the frame it reports in come from config/vehicles/<robot_name>.yaml via the launch file.

    # Default port for the DVL-A50
    port: 16171

    # Timeout for the DVL connection
    timeout: 5 # seconds

    # All measurements from the DVL use the following coordinate
    # convention:
    # - x: Forward
    # - y: Right
    # - z: Down
    # This can be rotated using the mounting_rotation_offset parameter.

    speed_of_sound: 1481 # m/s

    # Rotate the DVL measurements about the z-axis. This is useful if the DVL
    # is mounted at an angle.
    mounting_rotation_offset: 0 # degrees

    # Turn on acoustic waves. Can be set to false to help keep temperatures down.
    acoustic_enabled: true

    # Turn off dark mode (no LED).
    dark_mode_enabled: false

    # Set the range mode to auto
    range_mode: "auto"

    # Enable periodic cycling: the DVL periodically searches for a bottom lock shorter than the existing one.
    periodic_cycling_enabled: true

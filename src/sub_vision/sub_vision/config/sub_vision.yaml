# sub_vision perception node configuration.
# Topics are relative to the node namespace (e.g. /marlin_v2/oak/...), matching
# the OAK-D Pro contract that the Stonefish bridge reproduces in sim.
/**:
  ros__parameters:
    # Where <task>.pt source models (and optional <task>.names) live.
    model_dir: "/home/avbotz/sub_vision/models"

    # Pre-load this task on startup ("" = wait for a load_model service call).
    default_task: ""

    # Inference runs through the Ultralytics API. device: auto picks cuda when
    # available (GPU torch build) else cpu.
    device: "auto"
    input_size: 640
    conf_threshold: 0.25
    warmup_iterations: 3

    # OAK-D Pro topic contract (identical in sim and on hardware).
    rgb_topic: "oak/rgb/image_raw"
    depth_topic: "oak/stereo/image_raw"
    camera_info_topic: "oak/rgb/camera_info"
    detections_topic: "vision/detections"
    sync_slop_s: 0.05

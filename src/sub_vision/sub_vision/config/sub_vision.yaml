# sub_vision perception node configuration.
# Topics are relative to the node namespace (e.g. /marlin_v2/...). Each launch
# file overrides rgb_topic/camera_info_topic with its camera source: Stonefish
# publishes front_camera/image_color in sim, the usb_cam driver publishes
# front_camera/image_raw at pool tests.
/**:
  ros__parameters:
    # Where <task>.onnx / <task>.engine models (and optional <task>.names) live.
    model_dir: "weights"

    # Pre-load this task on startup ("" = wait for a load_model service call).
    default_task: ""

    # backend: auto prefers a serialized <task>.engine (TensorRT, Jetson) and
    # falls back to <task>.onnx (ONNX Runtime). device only applies to
    # onnxruntime: auto picks cuda when the CUDA provider is available, else cpu.
    backend: "auto"
    device: "auto"
    input_size: 640
    conf_threshold: 0.25
    warmup_iterations: 3

    # Front-camera contract; launch files override the two input topics.
    rgb_topic: "front_camera/image_raw"
    camera_info_topic: "front_camera/camera_info"
    detections_topic: "vision/detections"

    # image_transport convention: "raw" subscribes <rgb_topic>, "compressed"
    # subscribes <rgb_topic>/compressed (use when frames cross the network,
    # e.g. running vision on a laptop against the sub's cameras).
    image_transport: "raw"

    # Optional Depth Anything V2 Small relative-depth sidecar. It does not
    # replace calibrated PnP; torp uses it only after PnP establishes scale.
    depth_enabled: false
    depth_model_path: "weights/depth_anything_v2_vits.onnx"
    depth_backend: "auto"  # prefers a sibling .engine on Jetson
    depth_device: "auto"
    depth_input_size: 518
    depth_rate_hz: 5.0
    depth_max_age_s: 0.15
    # Publishing is off by default; simulation enables both debug streams.
    depth_debug_enabled: false
    depth_debug_topic: "vision/depth_anything"          # 32FC1 relative depth
    depth_debug_color_topic: "vision/depth_anything_color"  # bgr8 Turbo view

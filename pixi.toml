# Everything the workspace needs is declared here and pinned in pixi.lock.
# Nothing is installed with apt or pip by hand.
#
#   pixi run build      colcon build
#   pixi run sim        ros2 launch sub_bringup sim_launch.py
#   pixi shell          interactive shell with ROS, the workspace, and DDS set up

[workspace]
name = "thalassic"
version = "0.1.0"
description = "ROS 2 Jazzy stack for AVBotz's Marlin V2 AUV"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
# linux-64: developer machines and CI. linux-aarch64: the Jetson AGX Orin.
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.50"

[dependencies]
# Pinned to the Jetson's system interpreter (Ubuntu 24.04) so JetPack-only
# modules such as tensorrt can be bridged into this environment on the vehicle.
python = "3.12.*"

# --- build tooling ---
compilers = "*"
cmake = "*"
make = "*"
pkg-config = "*"
git = "*"
colcon-common-extensions = "*"

ros-jazzy-ros-base = "*"
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-lint-common = "*"
ros-jazzy-ament-cmake-clang-format = "*"     # spinnaker_camera_driver test dependency
ros-jazzy-ament-cmake-vendor-package = "*"   # stonefish_vendor
ros-jazzy-eigen3-cmake-module = "*"          # libwaterlinked
ros-jazzy-generate-parameter-library = "*"   # waterlinked_dvl_driver
ros-jazzy-rviz2 = "*"
ros-jazzy-tf2-tools = "*"
ros-jazzy-tf2-geometry-msgs = "*"
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-robot-localization = "*"           # EKF
ros-jazzy-behaviortree-cpp = "*"             # sub_mission
ros-jazzy-marine-acoustic-msgs = "*"         # DVL messages
ros-jazzy-cv-bridge = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-diagnostic-updater = "*"           # spinnaker_camera_driver
ros-jazzy-angles = "*"                       # sub_control
ros-jazzy-rclcpp-components = "*"            # sub_sim_sensors
ros-jazzy-image-transport = "*"
ros-jazzy-image-transport-plugins = "*"      # compressed image transport for off-board vision
ros-jazzy-camera-info-manager = "*"          # spinnaker_camera_driver
ros-jazzy-message-filters = "*"              # sub_color_correction
ros-jazzy-pcl-conversions = "*"              # stonefish_ros2
ros-jazzy-usb-cam = "*"                      # Logitech C922 front camera

# --- native libraries ---
pcl = "*"                                    # stonefish_ros2
eigen = "*"                                  # libwaterlinked
nlohmann_json = "*"                          # libwaterlinked
yaml-cpp = "*"                               # spinnaker_camera_driver
libusb = "*"                                 # Spinnaker SDK runtime
ffmpeg = "*"                                 # Spinnaker SDK runtime
sdl2 = "*"                                   # Stonefish
freetype = "*"                               # Stonefish
glm = "*"                                    # Stonefish
libgl-devel = "*"                            # OpenGL headers for Stonefish
llvm-openmp = "*"                            # Spinnaker SDK runtime (libomp)

# --- Python ---
numpy = "*"
opencv = "*"                                 # must be the conda build: cv_bridge links against it
pyyaml = "*"                                 # pid_tuner
jinja2 = "*"                                 # sub_sim scenario templates
pyserial = "*"                               # sub_serial_drivers
pytorch = "*"                                # sub_color_correction (CPU build; see docs/setup.md for GPUs)
torchvision = "*"                            # ultralytics imports it
kornia = "*"                                 # sub_color_correction
onnxruntime = "*"                            # sub_vision inference off the Jetson
ultralytics = "*"                            # model export / run_gate_model
pytest = "*"

# Environment activation: workspace overlay, DDS profile, FLIR GenTL path
[activation]
scripts = ["scripts/setup.sh"]

[tasks]
build = { cmd = "colcon build", description = "Build the workspace (colcon_defaults.yaml applies)" }
clean = { cmd = "rm -rf build install log", description = "Remove colcon build, install and log directories" }
prune-symlinks = { cmd = "scripts/prune-symlinks.sh", description = "Delete dangling symlinks left in build and install" }
test = { cmd = "colcon test && colcon test-result --verbose", description = "Run colcon tests" }
sim = { cmd = "ros2 launch sub_bringup sim_launch.py", description = "Run the Stonefish simulation (append launch args, e.g. seed:=42)" }
pool = { cmd = "ros2 launch sub_bringup pool_test_launch.py", description = "Run the hardware stack (vehicle only)" }
reset-dds = { cmd = "pkill -f ros2 || true; rm -f /dev/shm/fastrtps_* /dev/shm/sem.fastrtps_*", description = "Kill stray ROS processes and stale Fast DDS shared memory (Linux)" }

# Everything the workspace needs is declared here and pinned in pixi.lock.
# Nothing is installed with apt or pip.
#
#   pixi run build      colcon build
#   pixi run sim        ros2 launch sub_bringup sim_launch.py
#   pixi shell          interactive shell with ROS, the workspace, and DDS set up

[workspace]
name = "thalassic"
version = "0.1.0"
description = "ROS 2 Jazzy stack for AVBotz's Marlin V3 AUV"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
# linux-64: developer machines and CI. linux-aarch64: the Jetson AGX Orin.
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.50"

[dependencies]
# Pinned to the Jetson's system interpreter (Ubuntu 24.04) so JetPack-only modules such as tensorrt can be bridged into this environment on the vehicle.
python = ">=3.12.14,<3.13"

# --- build tooling ---
compilers = ">=2.0.0,<3"
cmake = ">=4.4.3,<5"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
git = ">=2.55.0,<3"
colcon-common-extensions = ">=0.3.0,<0.4"

ros-jazzy-ros-base = ">=0.11.0,<0.12"
ros-jazzy-ament-cmake-vendor-package = ">=2.5.6,<3"   # stonefish_vendor
ros-jazzy-eigen3-cmake-module = ">=0.3.1,<0.4"          # libwaterlinked
ros-jazzy-generate-parameter-library = ">=0.7.6,<0.8"   # waterlinked_dvl_driver
ros-jazzy-rviz2 = ">=14.1.23,<15"
ros-jazzy-tf2-tools = ">=0.36.22,<0.37"
ros-jazzy-tf2-geometry-msgs = ">=0.36.22,<0.37"
ros-jazzy-foxglove-bridge = ">=3.4.3,<4"
ros-jazzy-robot-localization = ">=3.8.3,<4"           # EKF
ros-jazzy-behaviortree-cpp = ">=4.9.1,<5"             # sub_mission
ros-jazzy-marine-acoustic-msgs = ">=2.1.0,<3"         # DVL messages
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-diagnostic-updater = ">=4.2.7,<5"           # spinnaker_camera_driver
ros-jazzy-angles = ">=1.16.1,<2"                       # sub_control
ros-jazzy-rclcpp-components = ">=28.1.21,<29"            # sub_sim_sensors
ros-jazzy-image-transport = ">=5.1.8,<6"
ros-jazzy-image-transport-plugins = ">=4.0.7,<5"      # compressed image transport for off-board vision
ros-jazzy-camera-info-manager = ">=5.1.8,<6"          # spinnaker_camera_driver
ros-jazzy-message-filters = ">=4.11.17,<5"              # sub_color_correction
ros-jazzy-pcl-conversions = ">=2.6.5,<3"              # stonefish_ros2
ros-jazzy-usb-cam = ">=0.8.1,<0.9"                      # Logitech C922 front camera

# --- native libraries ---
pcl = ">=1.15.1,<2"                                    # stonefish_ros2
eigen = ">=5.0.1,<6"                                  # libwaterlinked
nlohmann_json = ">=3.12.0,<4"                          # libwaterlinked
yaml-cpp = ">=0.8.0,<0.9"                               # spinnaker_camera_driver
libusb = ">=1.0.29,<2"                                 # Spinnaker SDK runtime
ffmpeg = ">=9.0.1,<10"                                 # Spinnaker SDK runtime
sdl2 = ">=2.32.56,<3"                                   # Stonefish
freetype = ">=2.14.3,<3"                               # Stonefish
glm = ">=1.0.3,<2"                                    # Stonefish
libgl-devel = ">=1.7.0,<2"                            # OpenGL headers for Stonefish
llvm-openmp = ">=23.1.1,<24"                            # Spinnaker SDK runtime (libomp)

# --- Python ---
numpy = ">=2.5.3,<3"
opencv = ">=4.13.0,<5"                                 # must be the conda build: cv_bridge links against it
pyyaml = ">=6.0.3,<7"                                 # sub_bringup vehicle description
jinja2 = ">=3.1.6,<4"                                 # sub_sim scenario templates
pyserial = ">=3.5,<4"                               # sub_serial_drivers
pytorch = ">=2.13.0,<3"                                # sub_color_correction (CPU build; see docs/setup.md for GPUs)
torchvision = ">=0.28.0,<0.29"                            # ultralytics imports it
kornia = ">=0.7.1,<0.8"                                 # sub_color_correction
onnxruntime = ">=1.30.0,<2"                            # sub_vision inference off the Jetson
ultralytics = ">=8.4.146,<9"                            # model export / run_gate_model
aiohttp = ">=3.14.3,<4"                                # sub_pid_tuner dashboard server

# lint and format
ruff = ">=0.16.7,<0.17"          # Python: formatter and linter
clang-format = ">=23.1.1,<24"    # C/C++: formatter, reads .clang-format
mdformat = ">=1.0.0,<2"
go-shfmt = ">=3.14.1,<4"

# Environment activation: workspace overlay, DDS profile, FLIR GenTL path
[activation]
scripts = ["scripts/setup.sh"]

[tasks]
build = { cmd = "colcon build", description = "Build the workspace" }
clean = { cmd = "rm -rf build install log", description = "Remove colcon build, install and log directories" }
prune-symlinks = { cmd = "scripts/prune-symlinks.sh", description = "Delete dangling symlinks left in build and install" }
test = { cmd = "colcon test && colcon test-result --verbose", description = "Run colcon tests" }
format = { cmd = "scripts/format.sh", description = "Format all tracked Python and C/C++ (excludes submodules)" }
lint = { cmd = "scripts/format.sh --check", description = "Check formatting and run the Python linter without rewriting" }
sim = { cmd = "ros2 launch sub_bringup sim_launch.py", description = "Run the Stonefish simulation" }
pool = { cmd = "ros2 launch sub_bringup pool_test_launch.py", description = "Run the hardware stack (vehicle only)" }
reset-dds = { cmd = "pkill -f ros2 || true; rm -f /dev/shm/fastrtps_* /dev/shm/sem.fastrtps_*", description = "Kill stray ROS processes and stale Fast DDS shared memory (Linux)" }

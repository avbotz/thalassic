[workspace]
name = "thalassic"
version = "0.1.0"
description = "ROS Codebase for AVBotz AUVs"
channels = [
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
  "linux-64",
  "linux-aarch64",
  { name = "jetson", platform = "linux-aarch64", glibc = "2.39", cuda = { driver = "13", arch = "8.7" } },
]
requires-pixi = ">=0.83"

[environments]
default = ["dev"]
jetson = ["jetson"]

[feature.dev]
platforms = ["linux-64-cuda", "linux-64", "linux-aarch64"]

[feature.jetson]
platforms = ["jetson"]

[dependencies]
# Holds ROS at its last 3.12 build: RoboStack has since moved Jazzy to 3.14 (RoboStack/robostack#61).
python = ">=3.12,<3.13"

# Build tooling
c-compiler = ">=2,<3"
cxx-compiler = ">=2,<3"
cmake = ">=4,<5"
make = ">=4,<5"
colcon-common-extensions = ">=0.3,<0.4"

# ROS packages
ros-jazzy-ros-base = ">=0.11,<0.12"
ros-jazzy-eigen3-cmake-module = ">=0.3,<0.4"          # libwaterlinked
ros-jazzy-generate-parameter-library = ">=0.7,<0.8"   # sub_control, waterlinked_dvl_driver
ros-jazzy-tf2-geometry-msgs = ">=0.36,<0.37"
ros-jazzy-tf2-tools = ">=0.36,<0.37"
ros-jazzy-foxglove-bridge = ">=3,<4"
ros-jazzy-robot-localization = ">=3,<4"               # EKF
ros-jazzy-behaviortree-cpp = ">=4,<5"                 # sub_mission
ros-jazzy-marine-acoustic-msgs = ">=2,<3"             # DVL messages
ros-jazzy-cv-bridge = ">=4,<5"
ros-jazzy-vision-msgs = ">=4,<5"
ros-jazzy-diagnostic-updater = ">=4,<5"               # drivers', sub_control's and sub_vision's /diagnostics
ros-jazzy-diagnostic-aggregator = ">=4,<5"            # /diagnostics_agg (config/diagnostics.yaml)
ros-jazzy-image-transport = ">=5,<6"
ros-jazzy-image-transport-plugins = ">=4,<5"          # compressed image transport for off-board vision
ros-jazzy-camera-info-manager = ">=5,<6"              # spinnaker_camera_driver
ros-jazzy-usb-cam = ">=0.8,<0.9"                      # Logitech C922 front camera

# Native libraries
eigen = ">=5,<6"                                      # libwaterlinked
nlohmann_json = ">=3,<4"                              # libwaterlinked
yaml-cpp = ">=0.8,<0.9"                               # spinnaker_camera_driver
libusb = ">=1,<2"                                     # Spinnaker SDK runtime
ffmpeg = ">=9,<10"                                    # Spinnaker SDK runtime
llvm-openmp = ">=23,<24"                              # Spinnaker SDK runtime

# Python
numpy = ">=2,<3"
opencv = ">=4,<5"                                     # cv_bridge
pyyaml = ">=6,<7"                                     # sub_bringup
onnxruntime = ">=1,<2"
setuptools = "<80"                                    # needed for colcon (see colcon/colcon-core#696 and RoboStack/ros-jazzy#103)

# Jazzy's launch_testing pytest plugins fail to load under pytest 9 (fixed in Rolling by ros2/launch#972).
pytest = ">=8,<9"

[feature.dev.dependencies]
# ROS packages
ros-jazzy-rviz2 = ">=14,<15"
ros-jazzy-ament-cmake-vendor-package = ">=2,<3"       # stonefish_vendor
ros-jazzy-pcl-conversions = ">=2,<3"                  # stonefish_ros2
ros-jazzy-rclcpp-components = ">=28,<29"              # sub_sim_sensors

# Native libraries needed by Stonefish
pcl = ">=1,<2"
sdl2 = ">=2,<3"
freetype = ">=2,<3"
glm = ">=1,<2"
libgl-devel = ">=1,<2"

# Python
jinja2 = ">=3,<4"                                     # sub_sim

# Linting and formatting
ruff = ">=0.17,<0.18"
clang-format = ">=23,<24"
mdformat = ">=1,<2"
go-shfmt = ">=3,<4"
pre-commit = ">=4,<5"

# Compile cache for CI builds
ccache = ">=4,<5"

[feature.jetson.dependencies]
# CUDA 13 build, JetPack 7.2's major version. Has sm_80 kernels (which should be compatiable with the Jetson's sm_87)
onnxruntime = { version = ">=1,<2", build = "*cuda13*" }

[tasks]
build = { cmd = "colcon build", depends-on = ["_prune-symlinks"], description = "Build the workspace" }
clean = { cmd = "rm -rf build install log", description = "Remove build, install, and log directories" }
test = { cmd = "colcon test --return-code-on-test-failure && colcon test-result --verbose", description = "Run tests" }
fetch-weights = { cmd = "python scripts/fetch_weights.py", description = "Download the models in weights/manifest.toml into weights/ (--check only reports)" }
up = { cmd = "ros2 launch sub_bringup {{ target }}_launch.py", args = [{ arg = "target", default = "sim"  }], description = "Launch the $arg_launch.py" }
preflight = { cmd = "ros2 run sub_bringup preflight", description = "Check a running stack before it goes in the water (--sim for the simulator)" }
reset = { cmd = "ros2 daemon stop; pkill -f '(^|/)ros2 ' || true; rm -f /dev/shm/fastrtps_* /dev/shm/sem.fastrtps_*", description = "Stop all ROS2 processes and clear stale Fast DDS shared memory" }

_prune-symlinks = "scripts/prune-symlinks.sh"

[feature.dev.tasks]
format = { cmd = "scripts/format.sh", description = "Format files (--check just lints)" }
lint = { cmd = "scripts/format.sh --check", description = "Lint files" }
sync-mission = { cmd = "scripts/sync-mission.sh", description = "Test the mission behavior trees and copy them to the vehicle" }

[feature.jetson.tasks]
build = { cmd = "colcon build --packages-skip-regex '^(stonefish_.*|sub_sim.*)$'", depends-on = ["_prune-symlinks"], description = "Build the workspace (skips the simulator)" }

[activation]
scripts = ["scripts/setup.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"
SPINNAKER_GENTL64_CTI = "$PIXI_PROJECT_ROOT/install/lib/spinnaker-gentl/Spinnaker_GenTL.cti"

[feature.dev.activation.env]
ROS_AUTOMATIC_DISCOVERY_RANGE = "${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}"
# conda provides SDL2 using a shim that passes calls to SDL3. SDL2 uses X11 by default, while SDL3 uses Wayland.
# When using Wayland, the title bar disappear, so this line switches back to x11. Can be removed when Stonefish migrates to SDL3.
SDL_VIDEODRIVER = "x11"

[feature.jetson.activation.env]
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"

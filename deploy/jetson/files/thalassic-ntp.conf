# Vehicle NTP. Installed at /etc/chrony/conf.d/thalassic.conf, a drop-in on top of Ubuntu's /etc/chrony/chrony.conf.

# Serve time only to the vehicle subnet
allow 192.168.5.0/24

# Allow for local Jetson clock, unsynced with more accurate servers, to be used.
local stratum 10

# Step rather than slew whenever the offset is large.
makestep 1.0 -1
